 y="120">Start</text><text x="217" y="121">A</text><text x="365" y="49">B</text><text x="365" y="188">C</text><text x="491" y="188">D</text><text x="140" y="99">E1</text><text x="280" y="57">E2</text><text x="280" y="170">E3</text><text x="426" y="167">E4</text></g></svg><p class="legend">An original simplified pathway. Each labeled arrow is one enzyme-catalyzed step.</p>`;if(type==='phospholipid')html=`<svg viewBox="0 0 430 200" role="img" aria-label="A phospholipid has one phosphate-containing head and two long fatty-acid tails."><circle cx="88" cy="100" r="43" fill="#d3e8db" stroke="#155c4c" stroke-width="2"/><text x="88" y="105" font-size="17" text-anchor="middle" fill="#172e2a">Head</text><path d="M127 77L160 60L188 77L218 60L249 77L280 60L311 77L343 60M127 123L160 140L188 123L218 140L249 123L280 140L311 123L343 140" fill="none" stroke="#62548c" stroke-width="7"/><text x="236" y="190" font-size="16" text-anchor="middle" fill="#172e2a">Two fatty-acid tails</text><text x="88" y="30" font-size="16" text-anchor="middle" fill="#172e2a">Contains phosphate</text></svg>`;return `<div class="visual">${html}</div>`}
function renderSession(){if(session.complete){results();return}const item=session.items[session.index],q=BANK.find(q=>q.id===item.id), exam=session.mode==='exam';$('main').innerHTML=`<div class="question"><div class="row between"><span class="eyebrow">${exam?'Practice test':session.mode==='adaptive'?'Targeted review':'Quick practice'}</span>${btn('End round','end','ghost')}</div><div class="row between"><span class="small">Question ${session.index+1} of ${session.items.length}</span><span class="pill">${esc(q.topic)}${q.difficulty==='challenge'?' · Challenge':''}</span></div><div class="progress" role="progressbar" aria-label="Round progress" aria-valuenow="${session.index}" aria-valuemin="0" aria-valuemax="${session.items.length}"><span style="width:${session.index/session.items.length*100}%"></span></div><div class="card"><h2 id="prompt">${esc(q.prompt)}</h2><p class="small">${q.multi?'Select all that apply. Full credit requires exactly the correct choices.':'Choose one answer.'}</p>${visual(q.visual)}<div class="options" role="group" aria-labelledby="prompt">${item.order.map((i,n)=>{const sel=item.selected.includes(i), checked=item.checked&&!exam;return `<button type="button" class="option ${sel?'selected':''} ${checked&&q.answers.includes(i)?'correct':''} ${checked&&sel&&!q.answers.includes(i)?'wrong':''}" data-option="${i}" aria-pressed="${sel}" ${checked?'disabled':''}><span class="letter">${String.fromCharCode(65+n)}</span><span>${esc(q.options[i])}${checked&&q.answers.includes(i)?' ✓':''}${checked&&sel&&!q.answers.includes(i)?' ✕':''}</span></button>`}).join('')}</div>${item.checked&&!exam?feedback(q,item):''}<div class="row between"><div>${!exam&&!item.checked?btn('Need a hint?','hint','ghost'):exam?btn('Previous','previous','ghost'):''}</div>${exam?btn(session.index===session.items.length-1?'Finish test':'Next question','next','primary'):item.checked?btn(session.index===session.items.length-1?'See results':'Next question','next','primary'):`<button type="button" class="primary" data-action="check" ${item.selected.length?'':'disabled'}>Check answer</button>`}</div><div id="hint" aria-live="polite"></div>${exam?`<p class="small">${session.items.filter(i=>i.selected.length).length} / ${session.items.length} answered. Unanswered questions count as incorrect.</p>`:''}</div></div>`}
function reasoningFeedback(q,item){if(!q.reasoning)return '';const selected=(item?.selected||[]).filter(i=>!q.answers.includes(i));return `<div class="reasoning"><h3>Reasoning, step by step</h3><ol>${q.reasoning.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${selected.length?`<h3>Why your answer does not follow</h3>${selected.map(i=>`<p>${esc(q.optionFeedback[i])}</p>`).join('')}`:''}<details><summary>Why the other choices fail</summary>${q.options.map((x,i)=>q.answers.includes(i)?'':`<p><strong>${esc(x)}</strong><br>${esc(q.optionFeedback[i])}</p>`).join('')}</details></div>`}
function feedback(q,item){return `<div class="feedback ${isCorrect(item)?'':'wrong'}" role="status"><strong>${isCorrect(item)?'You’ve got it.':'Let’s connect the idea.'}</strong><p><b>Answer:</b> ${q.answers.map(i=>esc(q.options[i])).join('; ')}</p><p>${esc(q.explain)}</p>${reasoningFeedback(q,item)}</div>`}
function finish(){if(session.recorded)return;if(session.mode==='exam')session.items.forEach(record);session.complete=true;session.recorded=true;const correct=session.items.filter(isCorrect).length;data.history.unshift({date:Date.now(),mode:session.mode,total:session.items.length,correct});data.history=data.history.slice(0,30);save();render();window.scrollTo({top:0})}
function results(){const correct=session.items.filter(isCorrect).length,wrong=session.items.filter(i=>!isCorrect(i));$('main').innerHTML=`<div class="question"><div class="eyebrow">Round complete</div><h1>A little clearer.<br>A little stronger.</h1><div class="card"><div class="row between"><div><div class="score">${Math.round(correct/session.items.length*100)}%</div><p>${correct} of ${session.items.length} correct</p></div><div class="stack">${wrong.length?btn('Practice missed questions','retry','primary'):btn('Try another round','again','primary')}${btn('Back to practice','home')}</div></div><p class="muted">${wrong.length?'Read the explanations, then try answering those questions again without the choices.':'Great round. Try explaining the ideas in your own words, or choose a different topic.'}</p></div><h2 class="section">Your answer review</h2>${session.items.map((it,n)=>{const q=BANK.find(q=>q.id===it.id);return `<details ${isCorrect(it)?'':'open'}><summary>${isCorrect(it)?'✓':'↻'} ${n+1}. ${esc(q.prompt)}</summary><p class="small">Your answer: ${it.selected.length?it.selected.map(i=>esc(q.options[i])).join('; '):'Unanswered'}</p>${visual(q.visual)}${feedback(q,it)}</details>`}).join('')}</div>`}
function initDeck(){const p=pool();const due=p.filter(q=>!data.cards[q.id]||data.cards[q.id].due<=Date.now());deck=shuffle(due.length?due:p).slice(0,15).map(q=>q.id);flashIndex=0;flipped=false}
function flash(){if(!deck)initDeck();if(flashIndex>=deck.length){$('main').innerHTML=`<div class="question"><h1>Recall round complete.</h1><p>You reviewed ${deck.length} cards. Cards marked “Again” return sooner; cards you know are scheduled farther apart.</p>${btn('Start another set','newcards','primary')}${chips()}</div>`;return}const q=BANK.find(q=>q.id===deck[flashIndex]);$('main').innerHTML=`<div class="question"><div class="eyebrow">Active recall</div><h1>Think first. Then turn.</h1><p class="muted">Say the answer out loud before revealing it. Due cards are selected first; up to 15 cards per set.</p>${chips()}<div class="row between"><span class="pill">${esc(q.topic)}${q.difficulty==='challenge'?' · Challenge':''}</span><span class="small">Card ${flashIndex+1} / ${deck.length}</span></div><div class="card flash section"><h2>${esc(q.flashPrompt||q.prompt)}</h2>${visual(q.visual)}${flipped?`<p class="answer">${q.answers.map(i=>esc(q.options[i])).join('; ')}</p><p>${esc(q.explain)}</p>${reasoningFeedback(q,null)}`:`<p class="muted">No answer choices. What do you remember?</p>`}</div><div class="row section">${flipped?btn('Again — review soon','card-again')+btn('Got it — space it out','card-known','primary'):btn('Reveal answer','flip','primary')}</div><p class="small">Self-rated recall is kept separate from quiz scores.</p></div>`}
const EXPLAIN=[
['Enzymes','Why does boiling often stop an enzyme from working?','Heat can disrupt the interactions maintaining the protein’s shape. If the active site changes, substrate binding and catalysis are impaired. The enzyme is not simply “used up.”',['Connect heat to protein shape.','Connect active-site shape to function.','Distinguish denaturation from consumption.']],
['Proteins','Explain the difference between a peptide bond and a hydrogen bond.','A peptide bond is a covalent C–N bond linking amino-acid residues. Hydrogen bonds are attractions involving partial charges; they can stabilize protein folding and connect separate water molecules.',['Mention covalent electron sharing for peptide bonds.','Describe partial-charge attraction for hydrogen bonds.','Give one location for each.']],
['Building & breaking','How do dehydration synthesis and hydrolysis move water in opposite directions?','In the simplified model, dehydration joins units with net release of water. Hydrolysis uses water to split a covalent link, contributing H and OH to the pieces.',['State which process builds and which breaks.','Put water on the correct side of each reaction.']],
['Water & pH','A solution goes from pH 8 to pH 6. Explain what happens to H⁺ and OH⁻ at a fixed temperature.','The pH falls by two units, so H⁺ becomes 100 times as high. At a fixed temperature, H⁺ and OH⁻ have a constant product, so OH⁻ becomes one-hundredth as high.',['Use a factor of 100, not 2.','Give the correct direction for H⁺.','Give the opposite direction for OH⁻.']],
['Experiments','Why does yellow BTB not prove that a sample produced carbon dioxide?','BTB indicates pH. CO₂ can acidify water, but other acids also make BTB yellow. Controls and an additional CO₂ test, such as the classroom limewater test, help distinguish explanations.',['Identify what BTB actually detects.','Name an alternative cause of yellow.','Suggest useful additional evidence.']],
['Enzymes','A product-versus-time curve levels off. What would you test before concluding that the enzyme was destroyed?','I would add more substrate while holding other conditions constant. If product formation restarts, functional enzyme remains and substrate depletion is supported. A plateau alone does not identify a unique cause.',['Distinguish a measured result from its possible cause.','Suggest changing one factor.','Explain what a restart would show.']],
['Proteins','Compare primary, secondary, tertiary, and quaternary protein structure.','Primary is amino-acid sequence; secondary is local helices and sheets; tertiary is the overall fold of one polypeptide; quaternary is the arrangement of multiple polypeptide subunits.',['Name all four levels.','Distinguish one chain’s fold from multiple subunits.']],
['Molecules','How does phospholipid structure help form a cell membrane?','Phospholipids have water-attracting polar heads and water-avoiding nonpolar tails. In a bilayer, heads face the watery environments and tails cluster inward.',['Describe the two chemically different regions.','Explain the orientation of both in a bilayer.']]];
function explain(){const e=EXPLAIN[explainIndex];$('main').innerHTML=`<div class="question"><div class="eyebrow">Teach it back</div><h1>Could you explain it?</h1><p class="muted">Write a few sentences or explain aloud to a study partner. Compare with the checklist yourself; your writing is not automatically graded.</p><span class="pill">${e[0]} · ${explainIndex+1} / ${EXPLAIN.length}</span><div class="card section"><h2>${esc(e[1])}</h2><label for="written" class="small">Your explanation (optional; not saved)</label><textarea id="written" placeholder="I think this happens because…"></textarea><div id="model"></div><div class="row section">${btn('Show model & checklist','model','primary')}${btn('Next prompt','nextexplain')}</div></div></div>`}
const LESSONS=[
['Enzymes','Shape makes the reaction possible.','Enzymes speed reactions by lowering activation energy. Their active sites bind suitable substrates, and they are regenerated after catalysis. Temperature and pH affect their activity.','A plateau in product formation does not mean the enzyme was consumed. Try adding substrate and holding other conditions constant.','Learn the difference: high heat can denature a protein; moderate cooling usually slows collisions.'],
['Molecules','Match structure to function.','Carbohydrates include sugars used as fuel. Triglycerides store energy. Phospholipids form membrane bilayers. Proteins perform roles such as transport, defense, structure, and catalysis. Nucleic acids store and transmit genetic information.','A long hydrocarbon chain with a carboxyl group suggests a fatty acid. A phosphate head plus two fatty-acid tails suggests a phospholipid.','Carbon dioxide contains carbon, but is classified as inorganic. Carbon alone is not a sufficient test.'],
['Proteins','Sequence → folding → function.','Primary: amino-acid sequence. Secondary: alpha helices and beta sheets. Tertiary: one chain’s overall fold, influenced by R-group interactions. Quaternary: multiple polypeptide subunits together.','Find a peptide bond by locating –C(=O)–NH–. It is the C–N link between amino-acid residues.','Denaturation can disrupt folding without breaking the peptide bonds of the primary structure.'],
['Building & breaking','Track the water.','In simplified dehydration synthesis, units join and water is released. In hydrolysis, water is used to split a covalent link. Enzymes can catalyze these reactions.','A linear chain of n amino acids has n − 1 peptide links. Six amino acids have five links.','In the condensation model for a peptide link, OH comes from a carboxyl group and H from an amino group.'],
['Water & pH','Inside water versus between waters.','Inside one water molecule, O–H bonds are polar covalent. Between separate water molecules, a partially positive H can form a hydrogen bond with a partially negative O.','A one-unit fall in pH means ten times as much H⁺; two units means 100 times. At a fixed temperature, OH⁻ moves in the opposite direction.','Do not assume that every bond involving hydrogen is a hydrogen bond.'],
['Experiments','Read the evidence before the conclusion.','Identify what changes, what is measured, and what stays constant. A negative control provides a baseline. Average reaction rate is change in product divided by change in time.','BTB is a pH indicator. Yellow shows acidic conditions, which can be caused by CO₂ or other acids. Limewater can provide additional classroom evidence for CO₂.','Follow each arrow in a pathway. Blocking one enzyme can affect its downstream products while leaving another branch available.']];
function learn(){$('main').innerHTML=`<div class="eyebrow">The essentials</div><h1>Six ideas to connect.</h1><p class="muted">Use these compact lessons before a round—or when an explanation still feels unclear.</p><div class="two">${LESSONS.map((l,i)=>`<article class="card"><span class="pill">${l[0]}</span><h2>${l[1]}</h2><p>${l[2]}</p><details><summary>Make the connection</summary><p>${l[3]}</p><p class="muted">${l[4]}</p>${i===2?visual('peptide'):i===1?visual('phospholipid'):i===5?visual('pathway'):''}</details><button data-study="${esc(l[0])}">Practice this topic</button></article>`).join('')}</div><section class="card section"><span class="pill">Explore pH</span><h2>Move one unit. Change by ten.</h2><p>Compare hydrogen-ion concentration with pH 7. This is the introductory concentration approximation.</p><label for="ph">pH: <strong id="ph-value">7</strong></label><input id="ph" type="range" min="1" max="13" value="7" step="1"><p id="ph-result" aria-live="polite">Same H⁺ concentration as pH 7.</p></section><div class="notice">Coverage follows readable parts of the video, including enzymes, molecular structures, proteins, hydrolysis, water, pH, indicators, pathway diagrams, and data interpretation. Some filmed wording and labels were too blurry to recover exactly. The diagrams here are newly drawn teaching examples.</div>`}
function progress(){const stats=Object.values(data.stats),total=stats.reduce((a,s)=>a+s.attempts,0),correct=stats.reduce((a,s)=>a+s.correct,0);$('main').innerHTML=`<div class="eyebrow">${$('learner').selectedOptions[0].textContent} · personal record</div><h1>See what is sticking.</h1><p class="muted">Quiz accuracy includes repeat attempts. Flashcard self-ratings are tracked separately. These are study signals, not a prediction of your exam grade.</p><div class="metrics"><div class="metric"><strong>${stats.length}/${BANK.length}</strong><span>Unique questions tried</span></div><div class="metric"><strong>${total?Math.round(correct/total*100)+'%':'—'}</strong><span>Answer accuracy · ${total} attempts</span></div><div class="metric"><strong>${Object.keys(data.cards).length}</strong><span>Flashcards reviewed</span></div></div><div class="two"><section class="card"><h2>Topic accuracy</h2>${TOPICS.map(t=>{const qs=BANK.filter(q=>q.topic===t),ss=qs.map(q=>data.stats[q.id]).filter(Boolean),n=ss.reduce((a,s)=>a+s.attempts,0),c=ss.reduce((a,s)=>a+s.correct,0);return `<div class="topic-row"><strong>${t}</strong><span>${n?Math.round(c/n*100)+'%':'Not tried'}</span><span class="small">${ss.length}/${qs.length} questions explored · ${n} attempts</span><div class="progress"><span style="width:${n?c/n*100:0}%"></span></div></div>`}).join('')}</section><section class="card"><h2>Recent completed rounds</h2>${data.history.length?data.history.slice(0,8).map(h=>`<div class="topic-row"><span>${h.mode==='exam'?'Practice test':h.mode==='adaptive'?'Targeted review':'Quick practice'}<br><small class="muted">${new Date(h.date).toLocaleDateString()}</small></span><strong>${h.correct}/${h.total}</strong></div>`).join(''):'<p class="muted">Your completed rounds will appear here.</p>'}<div class="section">${btn('Review weak spots','start-adaptive','primary')}</div></section></div><div class="notice">Progress is saved on this device and browser when storage is available. The three learner slots keep your scores separate. Downloaded copies and hosted copies have separate progress.</div><div class="section">${btn('Reset this learner’s progress','reset','ghost')}</div>`}
$('main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;
 if(a==='challenge-start'){data.studyLevel='challenge';filter='All topics';deck=null;save();start('quick');return}
 if(b.dataset.topic){filter=b.dataset.topic;deck=null;render();return}if(b.dataset.study){filter=b.dataset.study;start('quick');return}
 if(b.dataset.option!==undefined){const it=session.items[session.index],q=BANK.find(q=>q.id===it.id);if(it.checked&&session.mode!=='exam')return;const i=Number(b.dataset.option);it.selected=q.multi?(it.selected.includes(i)?it.selected.filter(x=>x!==i):[...it.selected,i]):[i];save();renderSession();return}
 if(a?.startsWith('start-')){if(session&&!session.complete&&!confirm('Replace your current unfinished round? Checked practice answers stay in your record.'))return;start(a.slice(6));return}
 if(a==='check'){const it=session.items[session.index];if(!it.selected.length||it.checked)return;it.checked=true;record(it);save();renderSession()}
 if(a==='next'){if(session.index===session.items.length-1){if(session.mode==='exam'&&session.items.some(i=>!i.selected.length)&&!confirm('Some questions are unanswered and will count as incorrect. Finish anyway?'))return;finish()}else{session.index++;save();renderSession();window.scrollTo({top:0})}}
 if(a==='previous'){session.index=Math.max(0,session.index-1);save();renderSession()}
 if(a==='hint'){$('hint').innerHTML=`<div class="hint">${esc(BANK.find(q=>q.id===session.items[session.index].id).hint)}</div>`}
 if(a==='end'){if(confirm('End this unfinished round? Checked practice answers remain saved; unfinished test answers will not be graded.')){session=null;save();render()}}
 if(a==='home'){session=null;save();go('Practice')}
 if(a==='retry'){const ids=session.items.filter(i=>!isCorrect(i)).map(i=>i.id);start('quick',ids)}
 if(a==='again')start(session.mode);
 if(a==='flip'){flipped=true;flash()}
 if(a==='newcards'){initDeck();flash()}
 if(a==='card-again'||a==='card-known'){const id=deck[flashIndex],old=data.cards[id]||{stage:0};const stage=a==='card-known'?Math.min(4,old.stage+1):0;data.cards[id]={stage,due:Date.now()+(stage?[0,1,3,7,14][stage]*86400000:60000)};save();flashIndex++;flipped=false;flash()}
 if(a==='model'){$('model').innerHTML=`<div class="feedback"><h3>Model explanation</h3><p>${esc(EXPLAIN[explainIndex][2])}</p><h3>Did your answer include…</h3>${EXPLAIN[explainIndex][3].map(s=>`<label><input type="checkbox"> ${esc(s)}</label>`).join('')}</div>`;b.disabled=true}
 if(a==='nextexplain'){explainIndex=(explainIndex+1)%EXPLAIN.length;explain()}
 if(a==='reset'&&confirm('Delete all quiz scores, flashcard schedules, and the saved round for this learner? Other learners will be kept.')){data=fresh();session=null;deck=null;save();render()}
});

// Biology arcade: independent, persistent game state for each learner.
const GAME_INFO={boss:['🧬','Enzyme Arena','Battle three lab monsters. Build answer combos, charge a shield, and recover with a limited medkit.'],escape:['🔐','Escape the Lab','Five locked rooms. Read the evidence, crack the codes, and bring the lab back online.'],forge:['⚗️','Molecule Forge','Choose your ingredients, control the water, and build—or break—the requested molecule.'],match:['🧠','Memory Matrix','Flip cards to pair a biology concept with its meaning. Remember the science and the board.']};
const randInt=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
function arcadeData(){if(!data.arcade)data.arcade={active:null,bests:{},plays:0,wins:0};return data.arcade}
function activeGame(){return arcadeData().active}
function gameBtn(label,action,cls=''){return `<button type="button" data-game-action="${action}" class="${cls}">${label}</button>`}
function gameSave(){save()}
function gameHeader(g){return `<div class="row between"><span class="eyebrow">${GAME_INFO[g.kind][0]} ${GAME_INFO[g.kind][1]}</span>${gameBtn('Arcade lobby','lobby','ghost')}</div>`}
function gameFinish(won){const g=activeGame();if(!g||g.finished)return;g.finished=true;g.won=won;const a=arcadeData();a.plays++;a.wins+=won?1:0;a.bests[g.kind]=Math.max(a.bests[g.kind]||0,g.score);gameSave()}
function renderGames(){const a=arcadeData(),g=a.active;if(g&&!g.paused){if(g.finished)return gameResults(g);if(g.kind==='boss')return bossRender(g);if(g.kind==='escape')return escapeRender(g);if(g.kind==='forge')return forgeRender(g);if(g.kind==='match')return matchRender(g)}$('main').innerHTML=`<div class="arcade-hero"><div class="eyebrow">New / Biology arcade</div><h1>Play your way<br>to “I get it.”</h1><p>Four different games. Real biology. No timers, no pressure—just one more try.</p><div class="row"><span class="arcade-pill">${a.wins} wins</span><span class="arcade-pill">${a.plays} completed runs</span>${g&&!g.finished?gameBtn('Resume '+GAME_INFO[g.kind][1],'resume','primary'):''}</div></div><div class="two section">${Object.entries(GAME_INFO).map(([k,v])=>`<article class="card game-card"><div class="game-icon" aria-hidden="true">${v[0]}</div><div class="row between"><h2>${v[1]}</h2><span class="pill">Best ${a.bests[k]||0}</span></div><p class="muted">${v[2]}</p><button class="primary" data-new-game="${k}">Play ${v[1]}</button></article>`).join('')}</div><div class="notice">Games use the topics in your practice test. Arcade scores are separate from quiz accuracy. Your current run and best scores save for the selected learner. All science challenges are untimed; take as long as you need.</div>`}
function newGame(kind){const current=activeGame();if(current&&!current.finished&&!confirm('Start a new game and replace your unfinished arcade run? Your best scores and regular practice stay saved.'))return;const base={kind,score:0,finished:false,paused:false,feedback:null};if(kind==='boss'){Object.assign(base,{hp:5,bossHP:6,stage:0,combo:0,charge:0,shield:false,medkit:true,index:0,deck:shuffle(BANK.filter(q=>!q.multi&&q.difficulty!=='challenge')).map(q=>({id:q.id,order:shuffle(q.options.map((_,i)=>i))})),answered:false})}else if(kind==='escape'){Object.assign(base,{rooms:makeRooms(),index:0,attempts:0,hints:0,hintUsed:false,solved:false,input:''})}else if(kind==='forge'){Object.assign(base,{recipes:makeRecipes(),index:0,inventory:[0,0,0,0,0,0],water:0,reaction:'join',errors:0,solved:false})}else if(kind==='match'){const pairs=shuffle(MATCH_PAIRS).slice(0,6);Object.assign(base,{cards:shuffle(pairs.flatMap((p,i)=>[{pair:i,text:p[0],type:'CONCEPT'},{pair:i,text:p[1],type:'MEANING'}])),open:[],matched:[],turns:0})}else return;arcadeData().active=base;gameSave();view='Games';render();window.scrollTo({top:0})}
function gameResults(g){const titles={boss:'Lab monsters defeated!',escape:'You escaped the lab!',forge:'Master builder unlocked!',match:'Matrix restored!'};$('main').innerHTML=`<div class="question">${gameHeader(g)}<div class="card game-finish section"><div class="game-trophy" aria-hidden="true">${g.won?'🏆':'🛠️'}</div><div class="eyebrow">${g.won?'Mission complete':'Research continues'}</div><h1>${g.won?titles[g.kind]:'The lab needs a rematch.'}</h1><div class="score">${g.score}</div><p>points · Best ${arcadeData().bests[g.kind]||0}</p><p class="muted">${g.won?'You earned the points by connecting biology ideas. Play again for new combinations.':'Every explanation is a clue for your next run. Try a medkit or charge your shield before the next attack.'}</p><div class="row">${gameBtn('Play again','replay','primary')}${gameBtn('Choose another game','lobby')}</div></div></div>`}
const MONSTERS=[['🦠','The Substrate Slime','“I bet you think enzymes get used up!”'],['🐉','The Denaturation Dragon','“Can your knowledge survive the heat?”'],['👾','The pH Phantom','“One little pH unit… one big difference.”']];
function bossRender(g){const q=BANK.find(q=>q.id===g.deck[g.index].id),monster=MONSTERS[g.stage];$('main').innerHTML=`<div class="question">${gameHeader(g)}<div class="arena section"><div class="row between"><span>Round ${g.stage+1} / 3</span><strong>${g.score} points · Combo ${g.combo}</strong></div><div class="monster ${g.answered?'monster-hit':''}" aria-hidden="true">${monster[0]}</div><h2>${monster[1]}</h2><p>${monster[2]}</p><label>Boss health: ${g.bossHP} / 6</label><div class="boss-meter"><span style="width:${g.bossHP/6*100}%"></span></div><div class="row between"><strong aria-label="Your health ${g.hp} of 5">${'♥'.repeat(g.hp)}${'♡'.repeat(5-g.hp)} · ${g.hp}/5</strong><span>${g.shield?'🛡️ Shield armed':'Shield charge: '+g.charge+'/2'}</span></div></div><div class="row section"><button data-game-action="shield" ${g.charge<2||g.shield||g.answered?'disabled':''}>Arm shield · 2 charge</button><button data-game-action="heal" ${!g.medkit||g.hp>=5||g.answered?'disabled':''}>Medkit +2 ♥ · ${g.medkit?'1 left':'used'}</button></div><p class="small">Correct: 2 damage (3 on a combo of 3+). Wrong: lose 1 heart unless shielded. One medkit per run.</p><div class="card"><h2>${esc(q.prompt)}</h2>${visual(q.visual)}<div class="options">${g.deck[g.index].order.map(i=>`<button class="option ${g.answered&&i===q.answers[0]?'correct':''}" data-boss-choice="${i}" ${g.answered?'disabled':''}>${esc(q.options[i])}${g.answered&&i===q.answers[0]?' ✓':''}</button>`).join('')}</div>${g.feedback?`<div class="feedback ${g.feedback.ok?'':'wrong'}" role="status"><strong>${esc(g.feedback.title)}</strong><p>${esc(q.explain)}</p></div>`:''}${g.answered?gameBtn(g.hp===0?'See results':g.bossHP===0?(g.stage===2?'Claim victory':'Next monster'):'Next attack','boss-next','primary'):''}</div></div>`}
function bossAnswer(i){const g=activeGame();if(g.answered||g.finished)return;const q=BANK.find(q=>q.id===g.deck[g.index].id),ok=i===q.answers[0];g.answered=true;if(ok){g.combo++;const damage=g.combo>=3?3:2;g.bossHP=Math.max(0,g.bossHP-damage);g.score+=100+Math.min(g.combo-1,4)*25;g.charge=Math.min(2,g.charge+1);g.feedback={ok:true,title:`Hit! ${damage} damage${g.combo>=3?' · combo bonus!':''}`}}else{g.combo=0;const blocked=g.shield;if(blocked)g.shield=false;else g.hp--;g.feedback={ok:false,title:blocked?'Shield blocked the hit. Here’s the science.':'You lost 1 heart. Learn the counterattack.'}}gameSave();renderGames()}
function makeRooms(){const p=randInt(6,9),drop=randInt(1,3),n=randInt(4,9),optimal=randInt(2,5),amount=randInt(2,8);return [
{title:'The acid vault',icon:'🧪',story:`A leak changes the solution from pH ${p} to pH ${p-drop}. Enter the factor by which H⁺ concentration INCREASES to unlock the valve.`,answer:String(10**drop),hint:'Each downward pH step multiplies H⁺ by 10. Multiply once per step.',explain:`The drop is ${drop} unit${drop===1?'':'s'}: 10^${drop} = ${10**drop}.`,input:'number',unit:'Increase factor'},
{title:'The protein bridge',icon:'🌉',story:`The bridge needs a linear chain of ${n} amino acids. In the simplified dehydration model, how many water molecules are released when that chain forms?`,answer:String(n-1),hint:'Count the links connecting the units in one linear chain.',explain:`${n} amino acids form ${n-1} peptide links and release ${n-1} waters in the simplified model.`,input:'number',unit:'Water molecules'},
{title:'The enzyme engine',icon:'⚙️',story:'Restart the engine at the tested pH with the greatest enzyme activity. Enter that pH.',table:table(['Test pH','Activity (relative units)'],[[optimal-1,20],[optimal,90],[optimal+1,35],[optimal+2,5]]),answer:String(optimal),hint:'Compare activity values, not just pH values. The biggest pH is not necessarily the best.',explain:`The largest measured activity is 90 units at pH ${optimal}. This measures activity, not the amount of enzyme.`,input:'number',unit:'Best tested pH'},
{title:'The evidence locker',icon:'🔎',story:'A tube of BTB turns yellow. The guard claims this proves that CO₂ was produced. Enter the ONE word that BTB actually detects: acidity, protein, or oxygen.',answer:'acidity',hint:'Other acids can turn BTB yellow even when no CO₂ was produced.',explain:'BTB indicates acidity/basicity. Yellow supports acidic conditions; CO₂ is one possible cause, not the only cause.',input:'text',unit:'Evidence word'},
{title:'The final power cell',icon:'⚡',story:`An enzyme makes ${amount*10} mg of product in 10 seconds, starting from 0 mg. Enter its average production rate in mg/s to power the exit.`,answer:String(amount),hint:'Rate = change in product ÷ elapsed time.',explain:`${amount*10} mg ÷ 10 seconds = ${amount} mg/s.`,input:'number',unit:'Average rate (mg/s)'}]}
function escapeRender(g){const r=g.rooms[g.index];$('main').innerHTML=`<div class="question">${gameHeader(g)}<div class="room-map section" aria-label="Escape progress">${g.rooms.map((r,i)=>`<span class="${i<g.index?'done':i===g.index?'current':''}">${i<g.index?'✓':i+1}<small>${i<g.index?'Open':i===g.index?'Here':'Locked'}</small></span>`).join('')}</div><div class="card escape-room section"><div class="row between"><span class="pill">Room ${g.index+1} / 5</span><strong>${g.score} points</strong></div><div class="game-icon" aria-hidden="true">${r.icon}</div><h2>${r.title}</h2><p>${r.story}</p>${r.table?`<div class="visual">${r.table}</div>`:''}<label for="escape-code">${r.unit}</label><div class="row"><input class="lock-input" id="escape-code" type="${r.input}" ${r.input==='number'?'min="0" step="any" inputmode="decimal"':'autocomplete="off"'} value="${esc(g.input)}" ${g.solved?'disabled':''} aria-describedby="lock-result"><button class="primary" data-game-action="unlock" ${g.solved?'disabled':''}>Unlock</button></div><div id="lock-result" role="status">${g.feedback?`<div class="feedback ${g.feedback.ok?'':'wrong'}">${esc(g.feedback.text)}</div>`:''}</div>${g.solved?gameBtn(g.index===4?'Open the exit':'Enter next room','room-next','primary'):gameBtn(g.hintUsed?'Hint shown':'Ask the lab robot · −10 points','room-hint','ghost')}${g.hintUsed?`<p class="hint">🤖 ${r.hint}</p>`:''}<p class="small">Each room is worth 100 points. Wrong codes cost 20; the optional hint costs 10. No time limit and no lockouts.</p></div></div>`}
function escapeCheck(){const g=activeGame();if(g.solved||g.finished)return;const r=g.rooms[g.index],value=g.input.trim().toLowerCase();if(!value){g.feedback={ok:false,text:'Enter a code first. No points lost.'}}else if(r.input==='number'?Number(value)===Number(r.answer):value===r.answer){g.solved=true;const points=Math.max(0,100-g.attempts*20-(g.hintUsed?10:0));g.score+=points;g.feedback={ok:true,text:`Unlocked! +${points} points. ${r.explain}`}}else{g.attempts++;g.feedback={ok:false,text:'The door is still locked. Check your reasoning. '+(g.attempts>=2?r.hint:'Try the robot’s hint if you need a clue.')}}gameSave();renderGames()}
const INGREDIENTS=['Amino acids','Glucose molecules','Glycerol molecules','Fatty acids','Polypeptide chains','Disaccharides'];
function makeRecipes(){const n=randInt(3,7),m=randInt(4,8);return shuffle([
{name:`Build a ${n}-residue polypeptide`,target:`Join ${n} free amino acids into one linear chain.`,inventory:[n,0,0,0,0,0],reaction:'join',water:n-1,explain:`${n} amino acids need ${n-1} peptide links. In the simplified condensation model, forming them releases ${n-1} waters.`,product:'🟣'+'—🟣'.repeat(n-1)},
{name:`Break a ${m}-residue polypeptide`,target:`Completely hydrolyze ONE chain containing ${m} amino-acid residues. Start with the chain, not free amino acids.`,inventory:[0,0,0,0,1,0],reaction:'split',water:m-1,explain:`The single chain has ${m-1} peptide bonds. Hydrolysis uses ${m-1} waters and releases ${m} amino acids.`,product:Array(m).fill('🟣').join(' + ')},
{name:'Build a two-sugar molecule',target:'Join two glucose molecules into one disaccharide.',inventory:[0,2,0,0,0,0],reaction:'join',water:1,explain:'Two glucose molecules join through one glycosidic link with net release of one water.',product:'⬡—⬡'},
{name:'Take a disaccharide apart',target:'Completely hydrolyze ONE disaccharide into its two monosaccharides.',inventory:[0,0,0,0,0,1],reaction:'split',water:1,explain:'One water is used to hydrolyze the one link between the two sugar units.',product:'⬡ + ⬡'},
{name:'Assemble an energy store',target:'Build ONE triglyceride from glycerol and fatty acids, using the simplified condensation model.',inventory:[0,0,1,3,0,0],reaction:'join',water:3,explain:'One glycerol joins three fatty acids through three ester links, with net release of three waters in this model.',product:'🟡 + 3 tails → triglyceride'}])}
function forgeRender(g){const r=g.recipes[g.index];$('main').innerHTML=`<div class="question">${gameHeader(g)}<div class="row between section"><span class="pill">Blueprint ${g.index+1} / ${g.recipes.length}</span><strong>${g.score} points</strong></div><div class="card section"><h2>${r.name}</h2><p>${r.target}</p><p class="small">Choose only the starting materials. Then set the reaction and number of waters. The counters can be tapped or operated with the keyboard.</p><div class="ingredients">${INGREDIENTS.map((label,i)=>`<div class="ingredient"><strong>${label}</strong><div class="row"><button data-ingredient="${i}" data-delta="-1" aria-label="Remove one ${label.toLowerCase()}" ${g.solved||g.inventory[i]===0?'disabled':''}>−</button><output aria-label="Number of ${label.toLowerCase()}">${g.inventory[i]}</output><button data-ingredient="${i}" data-delta="1" aria-label="Add one ${label.toLowerCase()}" ${g.solved||g.inventory[i]>=12?'disabled':''}>+</button></div></div>`).join('')}</div><div class="two section"><label>Reaction<select id="forge-reaction" ${g.solved?'disabled':''}><option value="join" ${g.reaction==='join'?'selected':''}>Join · dehydration · release water</option><option value="split" ${g.reaction==='split'?'selected':''}>Split · hydrolysis · consume water</option></select></label><label>Water molecules<input id="forge-water" class="lock-input" type="number" min="0" max="12" step="1" value="${g.water}" ${g.solved?'disabled':''}></label></div><div role="status">${g.feedback?`<div class="feedback ${g.feedback.ok?'':'wrong'}"><strong>${g.solved?'Reaction successful!':g.feedback.ok?'Recipe clue':'Check the recipe.'}</strong><p>${esc(g.feedback.text)}</p>${g.solved?`<div class="reaction-product" aria-label="Schematic product illustration">${r.product}</div>`:''}</div>`:''}</div><div class="row section">${g.solved?gameBtn(g.index===g.recipes.length-1?'Claim your builder badge':'Next blueprint','forge-next','primary'):gameBtn('⚗️ React!','react','primary')+gameBtn('Show recipe clue','forge-hint','ghost')}</div><p class="small">100 points per blueprint, −15 per failed reaction; clues are free. These are introductory reaction models, not full cellular mechanisms.</p></div></div>`}
function forgeCheck(){const g=activeGame();if(g.solved||g.finished)return;const r=g.recipes[g.index],ingredients=r.inventory.every((n,i)=>n===g.inventory[i]);let reason='';if(!ingredients)reason='The starting ingredients do not match the target. '+r.target;else if(g.reaction!==r.reaction)reason='The ingredients are right. Does this target build links or break links?';else if(Number(g.water)!==r.water)reason='The ingredients and reaction are right. Count the links formed or broken: each needs one water released or consumed in this model.';if(reason){g.errors++;g.feedback={ok:false,text:reason}}else{g.solved=true;const points=Math.max(0,100-15*g.errors);g.score+=points;g.feedback={ok:true,text:`+${points} points. ${r.explain}`}}gameSave();renderGames()}
const MATCH_PAIRS=[['Peptide bond','Covalent link between amino-acid residues'],['Hydrolysis','Uses water to split a covalent link'],['Dehydration synthesis','Joins units with net release of water'],['Primary structure','The order of amino acids in a protein'],['Tertiary structure','The overall fold of one polypeptide'],['Quaternary structure','The arrangement of multiple polypeptide subunits'],['Enzyme','Catalyst that lowers activation energy'],['Phospholipid','Polar head and two fatty-acid tails'],['Nucleotide','Building block of DNA or RNA'],['Hydrogen bond','Attraction involving partial charges'],['Low pH','Higher hydrogen-ion concentration'],['Yellow BTB','Evidence of acidic conditions'],['Negative control','An untreated baseline for comparison'],['Active site','Region where suitable substrate binds'],['Denaturation','Disruption of a protein’s normal fold'],['Triglyceride','Glycerol joined to three fatty acids']];
function matchRender(g){const matched=g.matched.length/2;$('main').innerHTML=`<div class="question">${gameHeader(g)}<div class="row between section"><h2>Find the scientific connection.</h2><span class="pill">${matched} / 6 pairs · ${g.turns} turns</span></div><p>Match each CONCEPT with its MEANING. Tap two cards, read them, then clear mismatches when you are ready.</p><div class="memory-grid">${g.cards.map((c,i)=>{const done=g.matched.includes(i),open=g.open.includes(i)||done;return `<button class="memory-card ${open?'flipped':''} ${done?'matched':''}" data-memory="${i}" ${done||g.open.includes(i)||g.open.length===2?'disabled':''} aria-label="${open?esc(c.type+': '+c.text):'Face-down card '+(i+1)}">${open?`<small>${done?'✓ MATCHED':c.type}</small><span>${esc(c.text)}</span>`:`<span class="card-back" aria-hidden="true">✦</span><small>Card ${i+1}</small>`}</button>`}).join('')}</div><div role="status">${g.feedback?`<div class="feedback ${g.feedback.ok?'':'wrong'}">${esc(g.feedback.text)}</div>`:''}</div><div class="row section">${g.open.length===2?gameBtn('Turn them back over','close-pair','primary'):''}${matched===6?gameBtn('Collect your score','match-finish','primary'):''}</div><p class="small">Start at 600 points. Each mismatched pair costs 25; points never fall below zero. No speed bonus—read the meanings.</p></div>`}
function memoryFlip(i){const g=activeGame();if(g.finished||g.open.length===2||g.matched.includes(i)||g.open.includes(i))return;g.open.push(i);g.feedback=null;if(g.open.length===2){g.turns++;const [a,b]=g.open,ca=g.cards[a],cb=g.cards[b];if(ca.pair===cb.pair){g.matched.push(a,b);g.open=[];g.feedback={ok:true,text:`Connected: ${ca.type==='CONCEPT'?ca.text:cb.text} — ${ca.type==='MEANING'?ca.text:cb.text}.`}}else g.feedback={ok:false,text:'Not a pair. Read both, remember their locations, and try a different connection.'};}const misses=g.turns-g.matched.length/2;g.score=Math.max(0,600-misses*25);gameSave();renderGames()}
$('main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.newGame){newGame(b.dataset.newGame);return}if(b.dataset.openArcade!==undefined){go('Games');return}const g=activeGame();if(!g||view!=='Games')return;const a=b.dataset.gameAction;
if(a==='lobby'){g.paused=true;gameSave();renderGames();return}if(a==='resume'){g.paused=false;gameSave();renderGames();return}if(a==='replay'){newGame(g.kind);return}if(g.finished)return;
if(b.dataset.bossChoice!==undefined&&g.kind==='boss')return bossAnswer(Number(b.dataset.bossChoice));
if(a==='shield'&&g.kind==='boss'&&!g.answered&&g.charge>=2&&!g.shield){g.shield=true;g.charge-=2}
if(a==='heal'&&g.kind==='boss'&&!g.answered&&g.medkit&&g.hp<5){g.hp=Math.min(5,g.hp+2);g.medkit=false}
if(a==='boss-next'&&g.kind==='boss'&&g.answered){if(g.hp===0){gameFinish(false)}else if(g.bossHP===0&&g.stage===2){gameFinish(true)}else{if(g.bossHP===0){g.stage++;g.bossHP=6;g.score+=150}g.index=(g.index+1)%g.deck.length;g.answered=false;g.feedback=null}}
if(a==='unlock'&&g.kind==='escape')return escapeCheck();
if(a==='room-hint'&&g.kind==='escape'&&!g.solved){g.hintUsed=true}
if(a==='room-next'&&g.kind==='escape'&&g.solved){if(g.index===4)gameFinish(true);else{g.index++;g.input='';g.solved=false;g.attempts=0;g.hintUsed=false;g.feedback=null}}
if(b.dataset.ingredient!==undefined&&g.kind==='forge'&&!g.solved){const i=Number(b.dataset.ingredient);g.inventory[i]=Math.max(0,Math.min(12,g.inventory[i]+Number(b.dataset.delta)));g.feedback=null}
if(a==='react'&&g.kind==='forge')return forgeCheck();
if(a==='forge-hint'&&g.kind==='forge'&&!g.solved){g.feedback={ok:true,text:g.recipes[g.index].explain}}
if(a==='forge-next'&&g.kind==='forge'&&g.solved){if(g.index===g.recipes.length-1)gameFinish(true);else{g.index++;g.inventory=[0,0,0,0,0,0];g.water=0;g.reaction='join';g.errors=0;g.solved=false;g.feedback=null}}
if(b.dataset.memory!==undefined&&g.kind==='match')return memoryFlip(Number(b.dataset.memory));
if(a==='close-pair'&&g.kind==='match'){g.open=[];g.feedback=null}
if(a==='match-finish'&&g.kind==='match'&&g.matched.length===12)gameFinish(true);
if(a||b.dataset.ingredient!==undefined){gameSave();renderGames()}
});
$('main').addEventListener('input',e=>{const g=activeGame();if(!g||g.finished)return;if(e.target.id==='escape-code'&&g.kind==='escape')g.input=e.target.value;if(e.target.id==='forge-water'&&g.kind==='forge')g.water=e.target.value;gameSave()});
$('main').addEventListener('change',e=>{const g=activeGame();if(g?.kind==='forge'&&e.target.id==='forge-reaction'){g.reaction=e.target.value;gameSave()}});
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='escape-code'){e.preventDefault();escapeCheck()}});

try{const selected=localStorage.getItem('biology-active-learner');if(['1','2','3'].includes(selected)){profile=selected;$('learner').value=profile}}catch{}data=read();session=data.session;render();
</script></body></html>
